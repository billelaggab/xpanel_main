# XPanel. Used within the existing HTTP server block. Keep loopback-only
# access until a dedicated, authenticated TLS deployment has been configured.
location = /randomcodehere {
    return 302 /randomcodehere/index.php;
}
location = /randomcodehere/ {
    return 302 /randomcodehere/index.php;
}
location = /randomcodehere/index.php {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 8k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME __XPANEL_ROOT__/admin/index.php;
    fastcgi_param XPANEL_STATE_DIR __XPANEL_STATE__;
    fastcgi_pass php;
}
location = /randomcodehere/api.php {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 8k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME __XPANEL_ROOT__/admin/api.php;
    fastcgi_param XPANEL_STATE_DIR __XPANEL_STATE__;
    fastcgi_pass php;
}
location ^~ /randomcodehere/assets/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    alias __XPANEL_ROOT__/admin/assets/;
    autoindex off;
    add_header X-Content-Type-Options nosniff;
    types {
        text/css css;
        application/javascript js;
        font/woff2 woff2;
        text/plain txt;
    }
}
location ^~ /randomcodehere/ {
    return 404;
}
